<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="Architecture: CLI and desktop drive the runAgent loop, which uses providers, tools and permissions and writes an append-only JSONL session log">
  <defs>
    <clipPath id="card"><rect width="1600" height="720" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111216"/><stop offset="0.55" stop-color="#0A0B0D"/><stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#16A36A" stop-opacity="0.12"/><stop offset="0.6" stop-color="#16A36A" stop-opacity="0.03"/><stop offset="1" stop-color="#16A36A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5A6068"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1600" height="720" fill="url(#bg)"/>
    <rect width="1600" height="720" fill="url(#halo)"/>
    <rect width="1600" height="720" fill="url(#grid)"/>

    <g stroke="#5A6068" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
      <path d="M390 166 L700 236"/><path d="M1210 166 L900 236"/>
      <path d="M660 348 L440 416"/><path d="M800 348 L800 416"/><path d="M940 348 L1160 416"/>
      <path d="M440 512 L600 572"/><path d="M800 512 L800 572"/><path d="M1160 512 L1000 572"/>
    </g>

    <g>
      <rect x="240" y="70" width="300" height="96" rx="14" fill="#15171C" stroke="#31353C" stroke-width="1.2"/>
      <text x="390" y="111" text-anchor="middle" font-size="24" font-weight="500" fill="#ECEEF0">CLI</text>
      <text x="390" y="139" text-anchor="middle" font-size="17" font-weight="400" fill="#8A9097">src/cli</text>
    </g>

    <g>
      <rect x="1060" y="70" width="300" height="96" rx="14" fill="#15171C" stroke="#31353C" stroke-width="1.2"/>
      <text x="1210" y="111" text-anchor="middle" font-size="24" font-weight="500" fill="#ECEEF0">Desktop</text>
      <text x="1210" y="139" text-anchor="middle" font-size="17" font-weight="400" fill="#8A9097">desktop/</text>
    </g>

    <g>
      <rect x="560" y="236" width="480" height="112" rx="14" fill="#12201A" stroke="#16A36A" stroke-width="1.6"/>
      <text x="800" y="285" text-anchor="middle" font-size="26" font-weight="500" fill="#ECEEF0">runAgent loop</text>
      <text x="800" y="313" text-anchor="middle" font-size="17" font-weight="400" fill="#7FA28F">src/core</text>
    </g>

    <g>
      <rect x="300" y="416" width="280" height="96" rx="14" fill="#15171C" stroke="#31353C" stroke-width="1.2"/>
      <text x="440" y="457" text-anchor="middle" font-size="24" font-weight="500" fill="#ECEEF0">providers</text>
      <text x="440" y="485" text-anchor="middle" font-size="17" font-weight="400" fill="#8A9097">src/providers</text>
    </g>

    <g>
      <rect x="660" y="416" width="280" height="96" rx="14" fill="#15171C" stroke="#31353C" stroke-width="1.2"/>
      <text x="800" y="457" text-anchor="middle" font-size="24" font-weight="500" fill="#ECEEF0">tools</text>
      <text x="800" y="485" text-anchor="middle" font-size="17" font-weight="400" fill="#8A9097">src/tools</text>
    </g>

    <g>
      <rect x="1020" y="416" width="280" height="96" rx="14" fill="#15171C" stroke="#31353C" stroke-width="1.2"/>
      <text x="1160" y="457" text-anchor="middle" font-size="24" font-weight="500" fill="#ECEEF0">permissions</text>
      <text x="1160" y="485" text-anchor="middle" font-size="17" font-weight="400" fill="#8A9097">src/permissions</text>
    </g>
    <g>
      <rect x="280" y="572" width="1040" height="88" rx="14" fill="#101511" stroke="#16A36A" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="800" y="622" text-anchor="middle" font-size="22" font-weight="400" fill="#ECEEF0">append-only session log (JSONL)</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1599" height="719" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
